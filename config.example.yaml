# Copy to ./envcraft.yaml or $XDG_CONFIG_HOME/envcraft/envcraft.yaml
# (macOS: ~/Library/Application Support/envcraft/envcraft.yaml).
# Passphrases are never read from this file.
#
# This example keeps the built-in doctor list. `envcraft init` writes a
# project contract instead, with the services and env keys for one directory.

doctor:
  host: 127.0.0.1
  postgres_port: 5432
  redis_port: 6379
  timeout: 2s

env:
  file: .env
  vault: .env.vault
